<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complete Your Registration — The Inner Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d0d;--bone:#f2f0ec;--champ:#d8c69a;--gold:#C5A55A;--orange:#C5541A;--dim:#9a938a;--goldline:rgba(197,165,90,.35)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--bone);font-family:'Inter',sans-serif;line-height:1.6;min-height:100vh;padding:52px 20px}
.wrap{max-width:720px;margin:0 auto}
.lab{font-family:'Oswald',sans-serif;font-size:12px;font-weight:500;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:12px;margin-bottom:18px;justify-content:center}
.lab::before,.lab::after{content:"";width:28px;height:1px;background:var(--gold)}
h1{font-family:'Oswald',sans-serif;text-transform:uppercase;font-weight:600;font-size:34px;line-height:1.1;text-align:center;letter-spacing:.02em}
h1 .o{color:var(--orange)}
.sub{text-align:center;color:var(--dim);margin:16px auto 40px;max-width:540px;font-size:16px}
.formcard{border:1px solid var(--goldline);border-radius:14px;overflow:hidden;background:#fff}
iframe{display:block;width:100%;border:0}
.foot{text-align:center;color:var(--dim);font-size:13px;margin-top:28px}
.foot a{color:var(--gold);text-decoration:none}
@media(max-width:600px){h1{font-size:26px}body{padding:36px 16px}}
</style>
</head>
<body>
<div class="wrap">
  <p class="lab">Payment Confirmed</p>
  <h1>One last step to <span class="o">lock your day</span></h1>
  <p class="sub">You're in. Fill this out so we can prep everything for you before Medellín on October 3.</p>
  <div class="formcard">
    <iframe data-tally-src="https://tally.so/embed/44VLzX?alignLeft=1&hideTitle=1&dynamicHeight=1" loading="lazy" width="100%" height="1100" frameborder="0" title="The Inner Game — Registration"></iframe>
  </div>
  <p class="foot">The Inner Game · NoFiltr · Medellín · October 3, 2026 · <a href="/">Back to site</a></p>
</div>
<script src="https://tally.so/widgets/embed.js" onload="if(window.Tally)Tally.loadEmbeds()"></script>
<script>
  // Bulletproof: load the form directly (embed.js still handles auto-resize via postMessage).
  function loadTally(){
    document.querySelectorAll('iframe[data-tally-src]').forEach(function(f){
      if(!f.src){ f.src = f.getAttribute('data-tally-src'); }
    });
    if(window.Tally && Tally.loadEmbeds){ try{ Tally.loadEmbeds(); }catch(e){} }
  }
  if(document.readyState!=='loading'){ loadTally(); } else { document.addEventListener('DOMContentLoaded', loadTally); }
  window.addEventListener('load', loadTally);
</script>
</body>
</html>
